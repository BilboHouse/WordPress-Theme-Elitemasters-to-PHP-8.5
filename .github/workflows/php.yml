name: PHP compatibility

on:
  push:
    branches: ["main", "codex/php-8.3-8.5-compat"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  compatibility:
    name: PHPCompatibility 8.3–8.5
    runs-on: ubuntu-latest
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install PHPCompatibility in runner environment
        run: composer global require --no-interaction --no-progress phpcompatibility/php-compatibility

      - name: Register PHPCompatibility with PHP_CodeSniffer
        run: |
          "$(composer global config bin-dir --absolute)/phpcs" \
            --config-set installed_paths "$(composer global config home)/vendor/phpcompatibility/php-compatibility"

      - name: Scan theme PHP files for compatibility issues
        shell: bash
        run: |
          mapfile -d '' php_files < <(find . -type f -name '*.php' -size +0c -not -path './.git/*' -not -path './.github/*' -print0)
          if (("${#php_files[@]}" == 0)); then
            echo "No non-empty PHP files found."
            exit 1
          fi
          "$(composer global config bin-dir --absolute)/phpcs" \
            --standard=PHPCompatibility \
            --runtime-set testVersion 8.3-8.5 \
            "${php_files[@]}"

  lint:
    name: PHP ${{ matrix.php-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5"]

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all theme PHP files
        shell: bash
        run: |
          mapfile -d '' php_files < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './.github/*' -print0)
          if (("${#php_files[@]}" == 0)); then
            echo "No PHP files found."
            exit 1
          fi
          printf 'Linting %s PHP files with PHP %s\\n' "${#php_files[@]}" "${{ matrix.php-version }}"
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

  package:
    name: Build installable theme files
    runs-on: ubuntu-latest
    needs: [compatibility, lint]
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Stage theme files
        run: |
          mkdir "$RUNNER_TEMP/elitemasters"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' ./ "$RUNNER_TEMP/elitemasters/"

      - name: Upload installable theme files
        uses: actions/upload-artifact@v4
        with:
          name: elitemasters-php-8.3-8.5
          path: ${{ runner.temp }}/elitemasters/
          if-no-files-found: error
          include-hidden-files: true
