name: PHP compatibility

on:
  push:
    branches: ["main", "codex/php-8.3-8.5-compat"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  compatibility:
    name: PHPCompatibility 8.3–8.5
    runs-on: ubuntu-latest
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install PHPCompatibility in runner environment
        run: composer global require --no-interaction --no-progress phpcompatibility/php-compatibility

      - name: Scan theme PHP files for compatibility issues
        shell: bash
        run: |
          "$(composer global config bin-dir --absolute)/phpcs" \
            --standard=PHPCompatibility \
            --runtime-set testVersion 8.3-8.5 \
            --extensions=php \
            --ignore=*/vendor/*,*/node_modules/* \
            .

  lint:
    name: PHP ${{ matrix.php-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5"]

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all theme PHP files
        shell: bash
        run: |
          mapfile -d '' php_files < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          if (("${#php_files[@]}" == 0)); then
            echo "No PHP files found."
            exit 1
          fi
          printf 'Linting %s PHP files with PHP %s\n' "${#php_files[@]}" "${{ matrix.php-version }}"
          for file in "${php_files[@]}"; do
            php -l "$file"
          done
